name: Backup semanal

# Copia todo o Firestore (usuarios, mesos, registros) para um JSON e guarda como artifact por 30 dias.
# Roda para as duas marcas (vfit = forca--app, gislane = gislane-personal-trainer), cada uma lendo SÓ o próprio projeto.
# Artifacts: vfit = backup-firestore-<data> (nome de sempre); gislane = backup-gislane-firestore-<data>.
# Restaurar: baixe o artifact em Actions -> execução -> Artifacts e regrave cada documento com firebase-admin
# (db.collection(c).doc(id).set(dados)); datas estão em ISO e voltam a Timestamp com Timestamp.fromDate.
# A limpeza LGPD (limpeza-lgpd.yml) apaga os backups antigos da MESMA marca depois de uma exclusão: ambos usam o mesmo grupo de concorrência.
# ATENÇÃO: o artifact contém dados pessoais dos alunos, mas é CRIPTOGRAFADO (AES-256 com BACKUP_SENHA). Guarde a senha; sem ela o backup não abre.
on:
  schedule:
    - cron: '0 6 * * 0'
  workflow_dispatch:
    inputs:
      marca:
        description: Marca (projeto Firebase); o agendado roda as duas
        type: choice
        default: vfit
        options:
          - vfit
          - gislane

permissions:
  contents: read

jobs:
  preparar:
    runs-on: ubuntu-latest
    outputs:
      matriz: ${{ steps.m.outputs.matriz }}
    steps:
      # Agendado: as duas marcas. Manual: só a escolhida. Marca desconhecida = erro.
      - id: m
        env:
          EVENTO: ${{ github.event_name }}
          MARCA: ${{ inputs.marca }}
        run: |
          V='{"marca":"vfit","projeto":"forca--app"}'
          G='{"marca":"gislane","projeto":"gislane-personal-trainer"}'
          if [ "$EVENTO" != workflow_dispatch ]; then M="$V,$G"
          elif [ "$MARCA" = vfit ]; then M="$V"
          elif [ "$MARCA" = gislane ]; then M="$G"
          else echo "Marca inválida: '$MARCA'"; exit 1; fi
          echo "matriz={\"include\":[$M]}" >> "$GITHUB_OUTPUT"

  backup:
    runs-on: ubuntu-latest
    needs: preparar
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.preparar.outputs.matriz) }}
    concurrency:
      group: firestore-backup-${{ matrix.marca }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar dependências
        run: npm ci --ignore-scripts
      - name: Ler o Firestore (${{ matrix.marca }})
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          PROJETO: ${{ matrix.projeto }}
        run: |
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json" node tools/backup.mjs "$GITHUB_WORKSPACE/backup.json"
          rm -f "$RUNNER_TEMP/sa.json"
      - name: Criptografar o backup
        env:
          BACKUP_SENHA: ${{ secrets.BACKUP_SENHA }}
        run: |
          # Repositório público: o arquivo nunca sobe sem senha. Sem o segredo, falha aqui e nada é guardado.
          test -n "$BACKUP_SENHA" || { echo "Falta o segredo BACKUP_SENHA (Settings > Secrets and variables > Actions). Backup NÃO guardado."; exit 1; }
          openssl enc -aes-256-cbc -pbkdf2 -iter 600000 -salt -in backup.json -out backup.json.enc -pass env:BACKUP_SENHA
          rm -f backup.json
      - name: Data
        id: data
        run: echo "d=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.marca == 'vfit' && 'backup-firestore' || format('backup-{0}-firestore', matrix.marca) }}-${{ steps.data.outputs.d }}
          path: backup.json.enc
          retention-days: 30
