name: 2 etapas do coach

# Manutenção manual da verificação em 2 etapas (app autenticador) do coach. Veja tools/mfa.mjs.
# Escolha a marca (vfit = forca--app, gislane = gislane-personal-trainer); o e-mail do coach vale só no projeto da marca.
# - ativar-totp: liga o TOTP no projeto (antes: upgrade para o Identity Platform no console do Firebase).
# - desativar-coach: EMERGÊNCIA, para quando o coach perdeu o celular. Informe o e-mail do coach.
on:
  workflow_dispatch:
    inputs:
      acao:
        description: O que fazer
        type: choice
        required: true
        options:
          - ativar-totp
          - desativar-coach
      marca:
        description: Marca (projeto Firebase)
        type: choice
        default: vfit
        options:
          - vfit
          - gislane
      email:
        description: E-mail do coach (só para desativar-coach)
        required: false

permissions:
  contents: read

jobs:
  mfa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Projeto da marca
        id: proj
        env:
          MARCA: ${{ inputs.marca }}
        run: |
          case "$MARCA" in
            vfit) echo "p=forca--app" >> "$GITHUB_OUTPUT" ;;
            gislane) echo "p=gislane-personal-trainer" >> "$GITHUB_OUTPUT" ;;
            *) echo "Marca inválida: '$MARCA'"; exit 1 ;;
          esac
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar dependências
        run: npm ci --ignore-scripts
      - name: Executar
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          ACAO: ${{ inputs.acao }}
          EMAIL: ${{ inputs.email }}
          PROJETO: ${{ steps.proj.outputs.p }}
        run: |
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json" node tools/mfa.mjs
