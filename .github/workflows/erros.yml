name: Ver erros do app

# Manutenção manual: lista os 100 erros mais recentes no resumo da execução e apaga os com mais de 30 dias.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  erros:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Ler e limpar os logs
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          mkdir -p "$RUNNER_TEMP/adm" && cp tools/erros.mjs "$RUNNER_TEMP/adm/"
          cd "$RUNNER_TEMP/adm"
          npm init -y > /dev/null && npm install --silent firebase-admin@14.5.0
          GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json" node erros.mjs
