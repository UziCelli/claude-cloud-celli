name: Publicar push (Cloudflare)

# Publica o Worker de notificações do descanso (pasta push/) na Cloudflare.
# Secrets: CLOUDFLARE_API_TOKEN (permissão "Edit Cloudflare Workers") e CLOUDFLARE_ACCOUNT_ID.
on:
  push:
    paths:
      - 'push/**'
      - '.github/workflows/push.yml'
  workflow_dispatch:

concurrency:
  group: push-worker
  cancel-in-progress: false

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Publicar o Worker
        working-directory: push
        run: npx wrangler@4 deploy
      - name: Mostrar a URL pública
        run: |
          sub=$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" | jq -r '.result.subdomain')
          url="https://vfit-descanso.${sub}.workers.dev"
          echo "URL do Worker: $url"
          {
            echo "### URL do Worker de push"
            echo
            echo "\`$url\`"
            echo
            echo "Use como \`VITE_PUSH_URL\` no app (veja docs/push.md)."
          } >> "$GITHUB_STEP_SUMMARY"
