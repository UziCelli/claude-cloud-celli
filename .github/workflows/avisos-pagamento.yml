name: Avisos de mensalidade

# Roda para as duas marcas (cada uma só no PRÓPRIO projeto).
# - Todo dia às 8h47 de Brasília: mensalidade (quem vence em 3 dias ou hoje).
# - Lembrete do treino do dia (seg a sáb, 6h47 de Brasília): o agendador do GitHub atrasa de 5 a 10 horas neste
#   repositório, então o robô roda 3 vezes por dia só para ENTREGAR a lista ao Worker (push/), que guarda e dispara
#   pontualmente às 6h47. Cada rodada troca a lista da anterior. A mensalidade continua saindo quando o robô roda.
# O log só tem contagens: nunca nome, e-mail ou uid.
on:
  schedule:
    - cron: '47 11 * * *'
    - cron: '47 15 * * *'
    - cron: '47 21 * * *'
    - cron: '47 3 * * *'
  workflow_dispatch:
    inputs:
      marca:
        description: Marca (projeto Firebase); o agendado roda as duas
        type: choice
        default: vfit
        options:
          - vfit
          - gislane
      modo:
        description: Qual aviso mandar
        type: choice
        default: mensalidade
        options:
          - mensalidade
          - lembrete

permissions:
  contents: read

jobs:
  preparar:
    runs-on: ubuntu-latest
    outputs:
      matriz: ${{ steps.m.outputs.matriz }}
    steps:
      # Agendado: as duas marcas. Manual: só a escolhida. Marca desconhecida = erro.
      - id: m
        env:
          EVENTO: ${{ github.event_name }}
          MARCA: ${{ inputs.marca }}
        run: |
          V='{"marca":"vfit","projeto":"forca--app"}'
          G='{"marca":"gislane","projeto":"gislane-personal-trainer"}'
          if [ "$EVENTO" != workflow_dispatch ]; then M="$V,$G"
          elif [ "$MARCA" = vfit ]; then M="$V"
          elif [ "$MARCA" = gislane ]; then M="$G"
          else echo "Marca inválida: '$MARCA'"; exit 1; fi
          echo "matriz={\"include\":[$M]}" >> "$GITHUB_OUTPUT"

  avisar:
    runs-on: ubuntu-latest
    needs: preparar
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.preparar.outputs.matriz) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar dependências
        run: npm ci --ignore-scripts
      - name: Avisar (${{ matrix.marca }})
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          PROJETO: ${{ matrix.projeto }}
          MODO: ${{ ((github.event_name == 'schedule' && github.event.schedule != '47 11 * * *') || inputs.modo == 'lembrete') && 'lembrete' || 'mensalidade' }}
          # Agendado: o Worker guarda até as 6h47. Manual (teste): sai na hora.
          AGENDAR: ${{ github.event_name == 'schedule' && '1' || '' }}
        run: |
          trap 'rm -f "$RUNNER_TEMP/sa.json"' EXIT
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json" node tools/avisos-pagamento.mjs
